<title>Fair Share Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fridge chore chart. Each week is a board split into two lanes, one per person; dinners are a dated list per week. */
:root{
  --bg:#ECF0EF;
  --surface:#FFFFFF;
  --surface-2:#F3F6F5;
  --ink:#1A2324;
  --ink-2:#56635F;
  --line:#D3DCD9;
  --today:#D99A12;
  --warn:#B4372B;
  --focus:#2D6FC4;
  --c-teal:#0E857A; --c-tomato:#CF4335; --c-plum:#8A4FA8; --c-marigold:#9E6900; --c-sky:#2D6FC4; --c-leaf:#45882A;
  --on-person:#FFFFFF;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111817; --surface:#19211F; --surface-2:#1F2927; --ink:#E6EDEB; --ink-2:#9AA7A3; --line:#2D3937;
    --today:#F0B53A; --warn:#F07B6D; --focus:#6EA9F0;
    --c-teal:#3DC1B2; --c-tomato:#F07666; --c-plum:#BD8DD9; --c-marigold:#EDB83F; --c-sky:#6EA9F0; --c-leaf:#88C767;
    --on-person:#0F1A19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111817; --surface:#19211F; --surface-2:#1F2927; --ink:#E6EDEB; --ink-2:#9AA7A3; --line:#2D3937;
  --today:#F0B53A; --warn:#F07B6D; --focus:#6EA9F0;
  --c-teal:#3DC1B2; --c-tomato:#F07666; --c-plum:#BD8DD9; --c-marigold:#EDB83F; --c-sky:#6EA9F0; --c-leaf:#88C767;
  --on-person:#0F1A19; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
code{font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:5px}

.app{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;padding-block:12px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.tabs{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;margin-left:auto}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--surface)}
@media (max-width:620px){.tabs{margin-left:0;width:100%}.tab{flex:1;padding:8px 4px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{font-size:17px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.hint{color:var(--ink-2);font-size:13px;margin-top:8px;max-width:65ch}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2)}
.lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.primary:hover:not(:disabled){opacity:.88}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:transparent}
.btn.on{background:var(--surface-2);border-color:var(--ink-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:12px 20px;font-size:16px;justify-content:center}
.btn:disabled,.ibtn:disabled,.swap:disabled,.check:disabled{opacity:.45;cursor:not-allowed}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;flex:none;padding:0}
.ibtn:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.link{border:0;background:none;padding:0;color:var(--focus);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input:not([type]),input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;color:var(--ink);min-width:0}
textarea{width:100%;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.8}
@media (max-width:620px){input:not([type]),input[type=text],input[type=date],select,textarea{font-size:16px}}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ink);margin:0}

.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--pc);color:var(--on-person);font-family:var(--font-display);font-weight:800;flex:none;line-height:1}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--today) 24%,var(--surface));color:var(--ink);white-space:nowrap}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;background:color-mix(in srgb,var(--today) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--today) 45%,transparent)}

/* month bar */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:16px}
.mnav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.mnav h2{font-size:26px;min-width:8.4em;text-align:center;font-weight:800}
.mactions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:620px){.mnav{width:100%}.mnav h2{font-size:22px;min-width:0;flex:1}}

/* week boards */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.week.current{border-color:var(--today);box-shadow:0 0 0 3px color-mix(in srgb,var(--today) 20%,transparent)}
.week-h{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--line)}
.wno{font-family:var(--font-display);font-weight:800;font-size:16px}
.range{color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}
.prog{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lanes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.lane{padding:10px 8px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lane+.lane{border-left:1px dashed var(--line)}
.lane-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px;padding:0 2px 4px;min-width:0}
.lname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{margin-left:auto;font-weight:500;font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:center;gap:7px;padding:6px 2px 6px 6px;border-radius:12px;background:color-mix(in srgb,var(--pc) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--pc) 30%,transparent);min-width:0}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--pc);background:var(--surface);color:transparent;display:grid;place-items:center;flex:none;cursor:pointer;padding:0;transition:background .15s,color .15s}
.check:hover:not(:disabled){color:color-mix(in srgb,var(--pc) 60%,transparent)}
.pill.done .check{background:var(--pc);color:var(--on-person)}
.pill.pop .check{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.3) rotate(-10deg)}100%{transform:scale(1)}}
.pbody{display:flex;flex-direction:column;min-width:0;flex:1}
.pname{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.nth{font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pmeta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);margin-top:3px;flex-wrap:wrap}
.pill.done{background:var(--surface-2);border-style:dashed;border-color:var(--line)}
.pill.done .pname{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-2)}
.pill.missed{border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.missed-tag{color:var(--warn);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.swap{width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.swap:hover:not(:disabled){background:color-mix(in srgb,var(--pc) 20%,transparent);color:var(--ink)}
.effort{display:inline-flex;gap:2px}
.effort i{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--ink-2) 30%,transparent)}
.effort i.on{background:var(--pc,var(--ink-2))}
.free{margin:4px 2px;font-size:13px;color:var(--ink-2)}
.alldone{display:flex;align-items:center;gap:5px;margin:2px;font-size:12px;font-weight:700;color:var(--ink)}
.alldone svg{color:var(--pc)}
.week.slim .week-h{border-bottom:0}
.earlier{margin:0 0 12px}
.week-empty{padding:18px 14px;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sk{display:block;height:34px;border-radius:10px;background:var(--surface-2)}
.sk.w40{width:40%;height:16px}

/* home */
.greet{margin:4px 0 16px;display:flex;flex-direction:column;gap:6px}
.greet h1{font-size:30px;font-weight:800}
.whoami{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.tonight{padding:20px;background:radial-gradient(120% 130% at 100% 0%,color-mix(in srgb,var(--today) 17%,var(--surface)) 0%,var(--surface) 60%)}
.today-h{justify-content:space-between;margin-bottom:6px}
.mblocks{display:grid;gap:16px}
.mblocks.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mblocks.two .mblock+.mblock{border-left:1px dashed var(--line);padding-left:16px}
@media (max-width:560px){.mblocks.two{grid-template-columns:minmax(0,1fr)}.mblocks.two .mblock+.mblock{border-left:0;padding-left:0;border-top:1px dashed var(--line);padding-top:14px}}
.mb-h{display:flex;align-items:center;gap:6px}
.tdish{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4.6vw,36px);line-height:1.1;margin:6px 0 12px;text-wrap:balance;overflow-wrap:anywhere}
.mblocks.two .tdish{font-size:clamp(22px,3.2vw,28px)}
.tdish.empty{color:var(--ink-2);font-weight:600}
.trow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.who{display:inline-flex;align-items:center;gap:8px;font-size:15px}
.who.minor{font-size:14px;color:var(--ink-2)}
.who.minor b{color:var(--ink)}
.duo{display:inline-flex}
.duo .av+.av{margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.tactions{display:flex;flex-wrap:wrap;gap:8px}
.coin{width:18px;height:18px;border-radius:50%;background:linear-gradient(90deg,var(--ca) 50%,var(--cb) 50%);flex:none}
.coin.flipping{animation:coin 1.1s cubic-bezier(.3,.7,.4,1)}
@keyframes coin{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-5px)}100%{transform:rotateY(1800deg) translateY(0)}}

.score-people{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:6px}
.sp{display:flex;gap:10px;align-items:flex-start;min-width:0}
.sp div{display:flex;flex-direction:column;min-width:0;font-size:13px;color:var(--ink-2)}
.sp b{font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow{margin-top:12px}
.barlab{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:5px}
.num{font-variant-numeric:tabular-nums}
.bar{position:relative;display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.bar span+span{border-left:2px solid var(--surface)}
.bar.empty span{opacity:.2}
.bar .target{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);opacity:.6}
.verdict{margin-top:12px;font-size:14px}

.nlist{list-style:none;margin:0;padding:0}
.nlist li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.nmeals{display:flex;flex-direction:column;gap:5px;min-width:0}
.nm{display:flex;align-items:center;gap:8px;min-width:0}
.nm .ndish{flex:1;min-width:0}
.nicon{display:inline-grid;color:var(--ink-2);flex:none}
.cook-opts{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-top:12px}
.lunch-rule{min-width:180px}
.nlist li:first-child{border-top:0}
.nd{font-size:13px;color:var(--ink-2)}
.nd b{color:var(--ink);font-variant-numeric:tabular-nums}
.ndish{font-weight:600;overflow-wrap:anywhere}
.ndish.muted{font-weight:500}
.cchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}

/* chores */
.chores-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.chores-layout aside{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.chores-layout{grid-template-columns:minmax(0,1fr)}}
.confirm{margin-bottom:16px;border-color:var(--today)}
.confirm p{margin-bottom:12px}
.notice{margin-bottom:16px}
.howto{font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.howto b{color:var(--ink)}

/* meals */
.mweeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px;align-items:start}
.mweek-h{display:flex;gap:10px;align-items:baseline;padding:11px 14px}
.day{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;padding:6px 8px 6px 14px;border-top:1px solid var(--line)}
.day.today{background:color-mix(in srgb,var(--today) 13%,var(--surface))}
.day.past .dlabel,.day.past .dish{opacity:.6}
.dlabel{display:flex;flex-direction:column;line-height:1.05;padding-top:5px}
.dmeals{display:flex;flex-direction:column;gap:2px;min-width:0}
.mline{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:6px;align-items:center}
.mline.labeled{grid-template-columns:20px minmax(0,1fr) auto 36px}
.mlab{display:grid;place-items:center;color:var(--ink-2)}
.dow{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:700}
.dnum{font-family:var(--font-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.day .dish{width:100%;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:9px;font-weight:600}
.day .dish:hover:not(:disabled){border-color:var(--line)}
.day .dish:focus{border-color:var(--ink-2);background:var(--surface);outline:none}
.cookwrap{display:flex;align-items:center;gap:8px;min-width:0}
.dishes-by{font-size:12px;color:var(--ink-2);white-space:nowrap}
.cooksel{position:relative;display:inline-flex;align-items:center}
.cooksel select{appearance:none;-webkit-appearance:none;border-radius:999px;padding:5px 28px 5px 12px;font-size:13px;font-weight:700;border:1px dashed var(--line);background:transparent;color:var(--ink-2);cursor:pointer;max-width:160px;text-overflow:ellipsis}
.cooksel.set select{border:1px solid color-mix(in srgb,var(--pc,var(--ink-2)) 40%,transparent);background:color-mix(in srgb,var(--pc,var(--ink-2)) 14%,var(--surface));color:var(--ink)}
.cooksel.both select{border:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--ca) 18%,var(--surface)),color-mix(in srgb,var(--cb) 18%,var(--surface)))}
.cooksel svg{position:absolute;right:9px;pointer-events:none;color:var(--ink-2)}
@media (max-width:520px){
  .day{grid-template-columns:34px minmax(0,1fr);gap:4px;padding:6px 4px 6px 12px}
  .mline{grid-template-columns:minmax(0,1fr) auto 32px;gap:4px}
  .mline.labeled{grid-template-columns:18px minmax(0,1fr) auto 32px}
  .dishes-by{display:none}
  .day .dish{padding:7px 6px}
  .dice{width:32px;height:32px}
  .cooksel select{max-width:100px;padding:4px 22px 4px 9px;font-size:12px}
  .cooksel svg{right:6px}
}
.pmeal{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.chip .mtag{width:auto;height:auto;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.chip .mtag:hover:not(:disabled){color:var(--ink);border-color:var(--ink-2);background:var(--surface)}

.panel{margin-bottom:16px}
.panel-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.panel-grid{grid-template-columns:minmax(0,1fr)}}
.pcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.lab-inline{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.preview{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.preview li{display:flex;align-items:center;gap:4px 10px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.preview li:first-child{border-top:0}
.pd{font-size:13px;color:var(--ink-2);min-width:7.5em;font-variant-numeric:tabular-nums}
.pdish{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.replace{font-size:12px;color:var(--warn);width:100%}
.chips{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:500;max-width:100%}
.chip span{overflow-wrap:anywhere}
.chip button{border:0;background:transparent;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);cursor:pointer;flex:none;padding:0}
.chip button:hover{background:var(--line);color:var(--ink)}

/* setup */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start}
.setup .wide{grid-column:1/-1}
.people-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
@media (max-width:520px){.people-edit{grid-template-columns:minmax(0,1fr)}}

<script>
"use strict";
const { useState, useEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

/* ---------- dates (all local time, Monday-first weeks) ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dow = d => (d.getDay() + 6) % 7;
const mondayOf = d => addDays(d, -dow(d));
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const monthStart = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m - 1, 1); };
const shiftMonth = (mk, n) => { const d = monthStart(mk); return monthKey(new Date(d.getFullYear(), d.getMonth() + n, 1)); };
const weekNo = d => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1970, 0, 5)) / 604800000);
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);

/* A month's chore weeks are the weeks whose Monday falls in that month. */
function weeksOfMonth(mk) {
  let mon = mondayOf(monthStart(mk)); if (monthKey(mon) !== mk) mon = addDays(mon, 7);
  const out = []; while (monthKey(mon) === mk) { out.push(mon); mon = addDays(mon, 7); } return out;
}
function daysOfMonth(mk) { const out = []; let d = monthStart(mk); while (monthKey(d) === mk) { out.push(d); d = addDays(d, 1); } return out; }
const fmt = (d, o) => d.toLocaleDateString("en-GB", o);
const monthName = (mk, withYear = true) => fmt(monthStart(mk), withYear ? { month: "long", year: "numeric" } : { month: "long" });

  const end = addDays(mon, 6);

    ? `${mon.getDate()}–${end.getDate()} ${fmt(end, { month: "short" })}`
    : `${mon.getDate()} ${fmt(mon, { month: "short" })} – ${end.getDate()} ${fmt(end, { month: "short" })}`;

/* ---------- small helpers ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = k => { try { return localStorage.getItem("fairshare." + k); } catch (e) { return null; } };

const docsOf = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
const norm = s => (s || "").trim().replace(/\s+/g, " ");
const keyOf = s => norm(s).toLowerCase();
const rid = () => Math.random().toString(36).slice(2, 10);
const eff = t => Number(t.effort) || 2;
const other = k => (k === "a" ? "b" : "a");
const half = n => (Number.isInteger(n) ? String(n) : n.toFixed(1));
const reducedMotion = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } };
const byOrder = (x, y) => (x.order ?? 0) - (y.order ?? 0) || (x.name || "").localeCompare(y.name || "");

async function runPool(items, n, fn, onEach) {
  let i = 0, firstErr = null;
  const worker = async () => {
    while (i < items.length && !firstErr) {
      const it = items[i++];
      try { await fn(it); } catch (e) { firstErr = firstErr || e; }
      if (onEach) onEach();

  };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));

  catch (e) { if (e && e.code === "unavailable") { await sleep(300 + Math.random() * 700); return fn(); } throw e; }

/* ---------- model ---------- */
const COLORS = ["teal", "tomato", "plum", "marigold", "sky", "leaf"];
const FREQS = [["2x", "Twice a week"], ["1w", "Every week"], ["2wk", "Every 2 weeks"], ["1m", "Once a month"]];
const EFFORTS = [[1, "Quick"], [2, "Normal"], [3, "Big job"]];
const EFFORT_LABEL = { 1: "Quick job", 2: "Normal job", 3: "Big job" };
const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const DEFAULT_CFG = {
  people: { a: { name: "", color: "teal", uid: null }, b: { name: "", color: "tomato", uid: null } },
  split: 50, cookPattern: ["alt", "alt", "alt", "alt", "alt", "alt", "alt"], dishesRule: true, lunch: true, lunchCook: "alt",
};
/* One document per day holds both meals: dinner in dish/cook (the original fields), lunch in lunch/lunchCook. */
const MEALS = { lunch: { dish: "lunch", cook: "lunchCook", label: "Lunch" }, dinner: { dish: "dish", cook: "cook", label: "Dinner" } };
const lunchOn = cfg => !cfg || cfg.lunch !== false;
const mealSlots = cfg => (lunchOn(cfg) ? ["lunch", "dinner"] : ["dinner"]);
const ideaFits = (x, meal) => !x.meal || x.meal === meal;
const blankMeal = id => ({ date: id, month: id.slice(0, 7), dish: "", cook: "", lunch: "", lunchCook: "" });
function people(cfg) {
  const p = (cfg && cfg.people) || {};
  return {
    a: { key: "a", name: norm(p.a && p.a.name) || "Person A", color: (p.a && p.a.color) || "teal", uid: (p.a && p.a.uid) || null },
    b: { key: "b", name: norm(p.b && p.b.name) || "Person B", color: (p.b && p.b.color) || "tomato", uid: (p.b && p.b.uid) || null },
  };
}
const pStyle = (pp, k) => (k === "a" || k === "b" ? { "--pc": `var(--c-${pp[k].color})` } : {});
const duoStyle = pp => ({ "--ca": `var(--c-${pp.a.color})`, "--cb": `var(--c-${pp.b.color})` });

/*
  Chore planner. For every week of the month that is not over yet, each chore
  gets its slots (twice a week = 2, every 2 weeks = alternate weeks, monthly =
  one week). Slots are handed out greedily so each person's effort points stay
  close to the target split, with a penalty for giving someone the same chore
  they did last time. Ticked-off chores are never touched.
  mode "fill": keep every existing task, only create missing ones.
  mode "replan": keep done tasks, re-assign everything still open.
*/
function planChores({ mk, chores, monthTasks, history, cfg, today, mode }) {
  const allWeeks = weeksOfMonth(mk);
  const todayD = parseYmd(today);
  const planWeeks = allWeeks.filter(w => addDays(w, 6) >= todayD);
  const res = { writes: [], deletes: [], weeks: planWeeks.length, slots: 0 };
  if (!planWeeks.length || !chores.length) return res;
  const firstWk = ymd(planWeeks[0]);
  const planSet = new Set(planWeeks.map(ymd));
  const sorted = [...chores].sort(byOrder);
  const existing = Object.fromEntries(monthTasks.map(t => [t.id, t]));
  const slots = [];
  sorted.forEach((c, ci) => {
    let monthlyIdx = -1;
    if (c.freq === "1m" && !monthTasks.some(t => t.choreId === c.id && !planSet.has(t.week))) {
      monthlyIdx = ci % allWeeks.length;
      if (!planSet.has(ymd(allWeeks[monthlyIdx]))) monthlyIdx = allWeeks.indexOf(planWeeks[0]);
    }
    allWeeks.forEach((w, wi) => {
      const wk = ymd(w);
      if (!planSet.has(wk)) return;
      const n = c.freq === "2x" ? 2
        : c.freq === "2wk" ? ((weekNo(w) + (c.phase || 0)) % 2 === 0 ? 1 : 0)
        : c.freq === "1m" ? (wi === monthlyIdx ? 1 : 0) : 1;
      for (let s = 0; s < n; s++) {
        slots.push({ id: `${wk}_${c.id}_${s}`, week: wk, choreId: c.id, slot: s, name: c.name, effort: Number(c.effort) || 2, fixed: c.who === "a" || c.who === "b" ? c.who : null, ci });
      }
    });

  res.slots = slots.length;
  const share = { a: Math.min(0.9, Math.max(0.1, (cfg && cfg.split != null ? cfg.split : 50) / 100)) };
  share.b = 1 - share.a;
  const score = { a: 0, b: 0 };
  const last = {};
  history.filter(t => t.week < firstWk).sort((x, y) => x.week.localeCompare(y.week) || x.slot - y.slot).forEach(t => { last[t.choreId] = t.who; });
  monthTasks.filter(t => t.week < firstWk).forEach(t => { if (t.who in score) score[t.who] += eff(t); });
  const keep = t => !!t && (t.done || mode === "fill");
  const pick = sl => {
    if (sl.fixed) return sl.fixed;
    const prev = last[sl.choreId];
    // Balance comes first; repeating last time's chore only costs a quarter of its effort, enough to break near-ties.
    const cost = p => (score[p] + sl.effort + (prev === p ? sl.effort * 0.25 : 0)) / share[p];
    const ca = cost("a"), cb = cost("b");
    if (Math.abs(ca - cb) > 1e-9) return ca < cb ? "a" : "b";

  for (const w of planWeeks) {
    const wk = ymd(w);
    monthTasks.filter(t => t.week === wk && !slotIds.has(t.id)).forEach(t => {
      if (keep(t)) { if (t.who in score) score[t.who] += eff(t); } else res.deletes.push(t.id);
    });

    inWeek.filter(s => keep(existing[s.id])).forEach(s => {
      const t = existing[s.id]; if (t.who in score) score[t.who] += eff(t); last[s.choreId] = t.who;
    });

      .sort((x, y) => (y.fixed ? 1 : 0) - (x.fixed ? 1 : 0) || y.effort - x.effort || x.ci - y.ci || x.slot - y.slot);

      const who = pick(s);

/*
  Cooks: dinner follows the weekday pattern, lunch its own rule. "Take turns"
  goes to whoever has cooked fewer meals this month; on a tie it goes to the
  person who didn't cook that same meal the day before, so lunch and dinner
  alternate instead of one person always getting dinner.
*/
function planCooks({ mk, meals, cfg, today }) {
  const pattern = Array.isArray(cfg && cfg.cookPattern) ? cfg.cookPattern : DEFAULT_CFG.cookPattern;
  const slots = mealSlots(cfg);
  const cnt = { a: 0, b: 0 };
  const add = c => { if (c === "a" || c === "b") cnt[c]++; else if (c === "both") { cnt.a += 0.5; cnt.b += 0.5; } };
  Object.values(meals).forEach(m => { if (m.month === mk) slots.forEach(s => add(m[MEALS[s].cook])); });
  const out = {}; const prev = { lunch: null, dinner: null }; let count = 0;
  for (const d of daysOfMonth(mk)) {
    const id = ymd(d); const m = meals[id] || {};
    for (const s of slots) {
      const f = MEALS[s].cook;
      if (m[f]) { prev[s] = m[f]; continue; }
      if (id < today) continue;
      let who = s === "dinner" ? pattern[dow(d)] || "alt" : (cfg && cfg.lunchCook) || "alt";
      if (who === "alt") {
        // Prefer not to give one person both meals of a day, unless that would put them more than a meal behind.
        const today2 = slots.filter(o => o !== s).map(o => (out[id] && out[id][MEALS[o].cook]) || m[MEALS[o].cook]);
        const cost = p => cnt[p] + (today2.includes(p) ? 1.25 : 0);
        const ca = cost("a"), cb = cost("b");
        who = ca < cb ? "a" : cb < ca ? "b" : prev[s] === "a" ? "b" : "a";
      }
      add(who); prev[s] = who; (out[id] = out[id] || {})[f] = who; count++;
    }
  }
  return { rows: Object.entries(out).map(([id, patch]) => ({ id, patch })), count };
}

function suggestDish(dishes, meals, id, meal, exclude) {
  const fit = dishes.filter(x => ideaFits(x, meal));
  if (!fit.length) return null;
  const d = parseYmd(id); const recent = new Set();
  for (let k = -6; k <= 6; k++) {
    const m = meals[ymd(addDays(d, k))];
    if (m) { if (m.dish) recent.add(keyOf(m.dish)); if (m.lunch) recent.add(keyOf(m.lunch)); }
  }
  if (exclude) recent.add(keyOf(exclude));
  let pool = fit.filter(x => !recent.has(keyOf(x.name)));
  if (!pool.length) pool = fit.filter(x => keyOf(x.name) !== keyOf(exclude));
  if (!pool.length) pool = fit;
  return pool[Math.floor(Math.random() * pool.length)].name;
}

/* ---------- paste parsing ---------- */
const WD = { mon: 0, monday: 0, tue: 1, tues: 1, tuesday: 1, wed: 2, weds: 2, wednesday: 2, thu: 3, thur: 3, thurs: 3, thursday: 3, fri: 4, friday: 4, sat: 5, saturday: 5, sun: 6, sunday: 6 };
const MONTHS = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
const SEP = "[\\s:,\\-–—]";
function cleanLine(s) {
  return (s || "").replace(/\*\*|__|`/g, "").replace(/^\s*(?:[-*•·–—>]+|\d{1,2}[.)](?!\d)|#+)\s*/, "").trim();
}
function parseIdeas(t) {
  const out = [];
  for (const raw of (t || "").split(/\r?\n|;/)) {
    let s = cleanLine(raw); if (!s) continue;
    let meal = null;
    const m = s.match(/^(lunch|dinner|supper)\s*[:\-–—]\s*/i);
    if (m) { meal = m[1].toLowerCase() === "lunch" ? "lunch" : "dinner"; s = s.slice(m[0].length).trim(); }
    if (s) out.push({ name: s, meal });

}
function matchPerson(token, pp) {
  const t = keyOf(token).replace(/^(always|by|cook|cooks|chef)\s*:?\s+/, "");
  if (!t) return null;
  for (const k of ["a", "b"]) { const n = keyOf(pp[k].name); if (n && (t === n || t === n.split(" ")[0])) return k; }
  return null;
}
function matchCook(token, pp) {
  const p = matchPerson(token, pp); if (p) return p;
  const t = keyOf(token);
  if (/^(both|together|we|us|both of us)$/.test(t)) return "both";
  if (/^(out|eat out|eating out|takeaway|take-away|takeout|delivery|restaurant)$/.test(t)) return "out";
  return null;

function makeDate(y, mo, d) { const x = new Date(y, mo, d); return x.getMonth() === mo && x.getDate() === d ? x : null; }

  const out = []; const used = new Set();
  const startD = parseYmd(start); let base = startD; let header = null;

  const nextFree = (from, meal) => { let d = from; for (let i = 0; i < 366; i++) { if (free(ymd(d), meal)) return d; d = addDays(d, 1); } return from; };
  const onOrAfter = (from, wd) => { let d = from; for (let i = 0; i < 7; i++) { if (dow(d) === wd) return d; d = addDays(d, 1); } return from; };

    let s = cleanLine(raw); if (!s) continue;

    if (/^week\s*\d+\s*:?$/i.test(s)) continue;
    s = s.replace(/^day\s*\d+\s*[:\-–—.)]?\s*/i, "");

    if ((m = s.match(new RegExp("^([A-Za-z]+)\\.?(?=" + SEP + "|$)" + SEP + "*"))) && WD[m[1].toLowerCase()] !== undefined) { wd = WD[m[1].toLowerCase()]; s = s.slice(m[0].length); }
    if ((m = s.match(new RegExp("^(\\d{4})-(\\d{1,2})-(\\d{1,2})(?!\\d)" + SEP + "*")))) {

      const x = guessYear(MONTHS[m[2].slice(0, 3).toLowerCase()], +m[1]); if (x) { date = x; s = s.slice(m[0].length); }
    }
    let meal = null;
    const ml = s.match(/^(?:(lunch|dinner|supper)\b\s*[:\-–—]?|(?:evening|main)\s*[:\-–—])\s*/i);
    if (ml) { meal = ml[1] && ml[1].toLowerCase() === "lunch" ? "lunch" : "dinner"; s = s.slice(ml[0].length).trim(); }
    let cook = "";
    for (const re of [/\s*\(([^()]+)\)\s*$/, /\s+[-–—|]\s*([^-–—|]+)$/, /\s*,\s*([^,]+)$/]) {
      const cm = s.match(re);
      if (cm) { const w = matchCook(cm[1], pp); if (w) { cook = w; s = s.slice(0, cm.index).trim(); break; } }

    if (!s) { if (date || wd !== null) { header = date || onOrAfter(base, wd); base = header; } continue; }
    if (/:$/.test(s)) continue;
    meal = meal || "dinner";
    if (meal === "lunch" && !lunch) continue;
    let d = date || (wd !== null ? onOrAfter(base, wd) : null);
    if (d) header = d;
    else if (header && !used.has(ymd(header) + meal)) d = header;
    if (!d) { header = null; d = nextFree(cur[meal], meal); }
    const id = ymd(d); used.add(id + meal); base = d;
    if (d >= cur[meal]) cur[meal] = addDays(d, 1);
    out.push({ id, date: d, meal, dish: s, cook });
  }
  return out;
}
function parseChores(text, pp) {
  const out = [];
  const F = [
    [/twice a week|two times a week|2 times a week|2\s*x\s*(a\s*)?week|2x\/week/i, "2x"],
    [/every\s*(2|two|other)\s*weeks?|bi-?weekly|fortnight(ly)?/i, "2wk"],
    [/monthly|once a month|every month|1\s*x\s*(a\s*)?month/i, "1m"],
    [/weekly|every week|once a week|1\s*x\s*(a\s*)?week/i, "1w"],
  ];
  for (const raw of (text || "").split(/\r?\n/)) {
    let s = cleanLine(raw); if (!s) continue;
    let freq = null;
    for (const [re, f] of F) { const m = s.match(re); if (m) { freq = f; s = s.slice(0, m.index) + s.slice(m.index + m[0].length); break; } }
    let effort = null;
    const em = s.match(/(?:[,;|]\s*|\b(?:size|effort)\s*:?\s*)([123])\b\s*(?:pts?|points?)?/i);
    if (em) { effort = +em[1]; s = s.slice(0, em.index) + s.slice(em.index + em[0].length); }
    const parts = s.split(/[,;|()]|\s[-–—]\s/).map(x => x.trim()).filter(Boolean);
    let who = "rotate";
    for (const p of parts.slice(1)) { const w = matchPerson(p, pp); if (w) who = w; }
    const name = (parts[0] || "").replace(/[.:\-–—]+$/, "").trim();
    if (name) out.push({ name: name[0].toUpperCase() + name.slice(1), freq: freq || "1w", effort: effort || 2, who });
  }
  return out;
}

/* ---------- chores ---------- */
function TaskPill({ t, ctx, missed }) {
  const { pp, ro, choreMap, actions } = ctx;
  const [pop, setPop] = useState(false);
  const chore = choreMap[t.choreId];
  const name = (chore && chore.name) || t.name;
  const twice = chore && chore.freq === "2x";
  const o = other(t.who);
  const by = t.done && t.doneBy && t.doneBy !== t.who && pp[t.doneBy] ? pp[t.doneBy].name : null;
  const title = t.done ? `Done${by ? " by " + by : ""}${t.doneAt ? ", " + fmt(new Date(t.doneAt), { weekday: "short", day: "numeric", month: "short" }) : ""}` : undefined;
  const onCheck = () => { if (!t.done) { setPop(true); setTimeout(() => setPop(false), 600); } actions.toggleTask(t); };
  return html`<div className=${"pill" + (t.done ? " done" : "") + (missed ? " missed" : "") + (pop ? " pop" : "")} title=${title}>
    <button className="check" aria-pressed=${!!t.done} aria-label=${(t.done ? "Mark not done: " : "Mark done: ") + name} onClick=${onCheck} disabled=${ro}><${I.check} size=${15}/></button>
    <span className="pbody">
      <span className="pname">${name}${twice ? html` <span className="nth">${t.slot + 1} of 2</span>` : ""}</span>
      <span className="pmeta"><${Effort} n=${eff(t)}/>${missed ? html`<span className="missed-tag">missed</span>` : by ? html`<span>by ${by}</span>` : ""}</span>
    </span>
    ${!t.done && html`<button className="swap" onClick=${() => actions.swapTask(t)} disabled=${ro} aria-label=${`Give ${name} to ${pp[o].name}`} title=${`Give to ${pp[o].name}`}><${I.swap} size=${16}/></button>`}
  </div>`;
}

function WeekBoard({ ctx, mon, list, onPlan, planLabel }) {
  const { pp, today, choreMap, ro, busy } = ctx;
  const wk = ymd(mon); const curWk = ymd(mondayOf(parseYmd(today)));
  const isCur = wk === curWk, isPast = wk < curWk;
  const done = list.filter(t => t.done).length;
  const sortT = (x, y) => (((choreMap[x.choreId] || {}).order ?? 999) - ((choreMap[y.choreId] || {}).order ?? 999)) || x.slot - y.slot;
  if (isPast && !list.length) {
    return html`<section className="week past slim" aria-label=${`Week ${isoWeek(mon)}, not planned`}>
      <header className="week-h"><span className="wno">Week ${isoWeek(mon)}</span><span className="range">${rangeLabel(mon)}</span><span className="prog">Not planned</span></header>
    </section>`;
  }
  return html`<section className=${"week" + (isCur ? " current" : "") + (isPast ? " past" : "")} aria-label=${`Week ${isoWeek(mon)}, ${rangeLabel(mon)}`}>
    <header className="week-h">
      <span className="wno">Week ${isoWeek(mon)}</span>
      <span className="range">${rangeLabel(mon)}</span>
      ${isCur && html`<span className="tag">This week</span>`}
      ${list.length > 0 && html`<span className="prog">${done}/${list.length} done</span>`}
    </header>
    ${list.length ? html`<div className="lanes">${["a", "b"].map(k => {
        const items = list.filter(t => t.who === k).sort(sortT);
        const pts = items.reduce((s, t) => s + eff(t), 0);
        const left = items.filter(t => !t.done).length;
        return html`<div className="lane" key=${k} style=${pStyle(pp, k)}>
          <div className="lane-h"><${Avatar} p=${pp[k]} size=${24}/><span className="lname">${pp[k].name}</span><span className="pts">${pts} pt${pts === 1 ? "" : "s"}</span></div>
          ${items.length ? items.map(t => html`<${TaskPill} key=${t.id} t=${t} ctx=${ctx} missed=${isPast && !t.done}/>`) : html`<p className="free">Nothing this week</p>`}
          ${items.length > 0 && left === 0 && html`<p className="alldone"><${I.check} size=${14}/> All done</p>`}
        </div>`;
      })}</div>`
      : html`<div className="week-empty"><span>${isPast ? "Nothing was planned." : "Not planned yet."}</span>${onPlan && !isPast && html`<button className="btn primary" disabled=${ro || !!busy} onClick=${onPlan}>${planLabel}</button>`}</div>`}
  </section>`;
}

function Bar({ label, a, b, target, pp }) {

function Scoreboard({ ctx, mk }) {
  const { pp, tasks, meals, today, cfg } = ctx;
  const s = { a: { n: 0, done: 0, donePts: 0, cooked: 0 }, b: { n: 0, done: 0, donePts: 0, cooked: 0 } };
  tasks.forEach(t => {
    if (t.month !== mk || !s[t.who]) return;
    s[t.who].n++;
    if (t.done) { s[t.who].done++; const k = s[t.doneBy] ? t.doneBy : t.who; s[k].donePts += eff(t); }
  });
  Object.values(meals).forEach(m => {
    if (m.month !== mk || m.date > today) return;
    mealSlots(cfg).forEach(sl => {
      const c = m[MEALS[sl].cook];
      if (c === "a" || c === "b") s[c].cooked += 1;
      else if (c === "both") { s.a.cooked += 0.5; s.b.cooked += 0.5; }
    });
  });
  const split = cfg && cfg.split != null ? cfg.split : 50;
  const noun = lunchOn(cfg) ? "meal" : "dinner";
  const chT = s.a.donePts + s.b.donePts;
  let verdict = "Nothing ticked off yet this month.";
  if (chT) {
    const diff = Math.round((s.a.donePts / chT) * 100) - split;
    verdict = Math.abs(diff) <= 5 ? "Chores are right on your target split." : `${pp[diff > 0 ? "a" : "b"].name} has done more than their share of chores so far.`;
  }
  return html`<section className="card">
    <div className="card-h"><h3>${monthName(mk, false)} scoreboard</h3></div>
    <div className="score-people">${["a", "b"].map(k => html`<div className="sp" key=${k}>
      <${Avatar} p=${pp[k]} size=${34}/>
      <div><b>${pp[k].name}</b><span>${s[k].donePts} pts earned</span><span>${s[k].done}/${s[k].n} chores done</span><span>${half(s[k].cooked)} ${noun}${s[k].cooked === 1 ? "" : "s"} cooked</span></div>
    </div>`)}</div>
    <${Bar} label="Chore points done" a=${s.a.donePts} b=${s.b.donePts} target=${split} pp=${pp}/>
    <${Bar} label=${noun === "meal" ? "Meals cooked" : "Dinners cooked"} a=${s.a.cooked} b=${s.b.cooked} target=${50} pp=${pp}/>
    <p className="verdict">${verdict}</p>
  </section>`;
}

function ChoresTab({ ctx }) {

  const split = cfg.split != null ? cfg.split : 50;
  return html`<div>

function MealLine({ id, long, meal, ctx, labeled }) {

  const commit = () => { const v = norm(val); if (v !== saved) actions.saveMeal(id, { [F.dish]: v }); if (v !== val) setVal(v); };
  const cook = m[F.cook] || "";

  const canSuggest = dishes.some(x => ideaFits(x, meal));

            </li>`; })}</ul>`
          : html`<p className="muted small">Paste something on the left to see which day each meal lands on.</p>`}

const NEXT_TAG = { any: "lunch", lunch: "dinner", dinner: "any" };

function MealsTab({ ctx }) {
  const { month, today, dishes, actions, ro, busy } = ctx;
  const [panel, setPanel] = useState(null);
  const [showPast, setShowPast] = useState(false);
  const days = daysOfMonth(month);
  const groups = [];
  days.forEach(d => {
    const wk = ymd(mondayOf(d)); let g = groups[groups.length - 1];
    if (!g || g.wk !== wk) { g = { wk, mon: mondayOf(d), days: [] }; groups.push(g); }
    g.days.push(d);
  });
  const open = ymd(days[days.length - 1]) >= today;
  const toggle = p => setPanel(panel === p ? null : p);
  const curWk = ymd(mondayOf(parseYmd(today)));
  const pastCount = month === today.slice(0, 7) ? groups.filter(g => g.wk < curWk).length : 0;
  const visible = showPast ? groups : groups.filter(g => month !== today.slice(0, 7) || g.wk >= curWk);
  return html`<div>
    <${MonthBar} ctx=${ctx}>
      <button className=${"btn" + (panel === "paste" ? " on" : "")} onClick=${() => toggle("paste")} disabled=${ro} aria-expanded=${panel === "paste"}><${I.paste}/> Paste a menu</button>
      <button className=${"btn" + (panel === "ideas" ? " on" : "")} onClick=${() => toggle("ideas")} aria-expanded=${panel === "ideas"}><${I.bulb}/> Ideas · ${dishes.length}</button>
      ${open && html`<button className="btn" onClick=${() => actions.fillCooks(month)} disabled=${ro || !!busy}><${I.pot}/> Assign cooks</button>`}
      ${open && html`<button className="btn" onClick=${() => actions.fillDishes(month)} disabled=${ro || !!busy || !dishes.length} title=${dishes.length ? "Fill empty meals with random ideas" : "Add some meal ideas first"}><${I.dice}/> Fill empty days</button>`}
    <//>
    ${panel === "paste" && html`<${PastePanel} ctx=${ctx} onClose=${() => setPanel(null)}/>`}
    ${panel === "ideas" && html`<${IdeasPanel} ctx=${ctx}/>`}
    <datalist id="dish-ideas">${dishes.map(d => html`<option key=${d.id} value=${d.name}></option>`)}</datalist>
    ${pastCount > 0 && html`<button className="btn ghost sm earlier" onClick=${() => setShowPast(!showPast)} aria-expanded=${showPast}>${showPast ? "Hide earlier weeks" : `Show ${pastCount} earlier week${pastCount === 1 ? "" : "s"}`}</button>`}
    <div className="mweeks">${visible.map(g => html`<section className="card flush" key=${g.wk} aria-label=${`Dinners, week ${isoWeek(g.mon)}`}>
      <header className="mweek-h"><span className="wno">Week ${isoWeek(g.mon)}</span><span className="range">${rangeLabel(g.mon)}</span></header>
      ${g.days.map(d => html`<${DayRow} key=${ymd(d)} d=${d} ctx=${ctx}/>`)}
    </section>`)}</div>
  </div>`;
}

/* ---------- home ---------- */
function MealBlock({ ctx, meal }) {
  const { pp, meals, today, dishes, ro, actions, cfg, showToast } = ctx;
  const F = MEALS[meal]; const m = meals[today] || {};
  const dish = m[F.dish] || ""; const cook = m[F.cook] || "";
  const [flip, setFlip] = useState(false);
  const onFlip = async () => {
    setFlip(true);
    const who = Math.random() < 0.5 ? "a" : "b";
    await sleep(reducedMotion() ? 0 : 1100);
    setFlip(false);
    if (await actions.saveMeal(today, { [F.cook]: who })) showToast(`The coin says ${pp[who].name} ${meal === "lunch" ? "makes lunch" : "cooks dinner"}.`);
  };
  const canSuggest = dishes.some(x => ideaFits(x, meal));
  const onSurprise = () => { const d = suggestDish(dishes, meals, today, meal, dish); if (d) actions.saveMeal(today, { [F.dish]: d }); };
  const dishesBy = cfg.dishesRule !== false && (cook === "a" || cook === "b") ? other(cook) : null;
  return html`<div className="mblock">
    <div className="eyebrow mb-h"><${MealIcon} meal=${meal}/> ${F.label}</div>
    <div className=${"tdish" + (dish ? "" : " empty")}>${dish || `No ${F.label.toLowerCase()} planned`}</div>
    <div className="trow">
      ${cook === "a" || cook === "b"
        ? html`<span className="who"><${Avatar} p=${pp[cook]} size=${28}/><span><b>${pp[cook].name}</b> cooks</span></span>`
        : cook === "both"
        ? html`<span className="who"><span className="duo"><${Avatar} p=${pp.a} size=${28}/><${Avatar} p=${pp.b} size=${28}/></span><b>Together</b></span>`
        : cook === "out"
        ? html`<span className="who"><b>Eating out</b></span>`
        : html`<span className="who muted">Nobody is cooking yet</span>`}
      ${dishesBy && html`<span className="who minor"><${Avatar} p=${pp[dishesBy]} size=${20}/><span><b>${pp[dishesBy].name}</b> washes up</span></span>`}
    </div>
    <div className="tactions">
      ${!cook && html`<button className="btn sm" onClick=${onFlip} disabled=${ro || flip}><span className=${"coin" + (flip ? " flipping" : "")} style=${duoStyle(pp)}></span>${flip ? "Flipping…" : "Flip a coin"}</button>`}
      <button className="btn sm" onClick=${onSurprise} disabled=${ro || !canSuggest} title=${canSuggest ? "" : "Add meal ideas on the Meals tab first"}><${I.dice} size=${16}/> ${dish ? "Something else" : "Surprise me"}</button>
    </div>
  </div>`;
}

function Home({ ctx }) {
  const { tasks, today, pp, me, myId, ro, actions } = ctx;

  const [busy, setBusy] = useState(null);
  const toastTimer = useRef(null);

  const setTab = t => { setTabState(t); lsSet("tab", t); try { window.scrollTo({ top: 0 }); } catch (e) {} };
  const showToast = useCallback((text, kind = "ok") => {
    clearTimeout(toastTimer.current); setToast({ text, kind });
    toastTimer.current = setTimeout(() => setToast(null), kind === "err" ? 6500 : 3200);
  }, []);

  useEffect(() => { const t = setInterval(() => setToday(ymd(new Date())), 60000); return () => clearInterval(t); }, []);

  useEffect(() => {
    let alive = true;
    (async () => {
      const c = window.claude;
      if (!c || typeof c.use !== "function") { setDb(null); return; }
      const [d, u] = await Promise.all([c.use("db"), c.use("user")]);
      if (!alive) return;
      if (u) {
        const [id, w] = await Promise.all([u.id(), u.can("data.write")]);
        if (!alive) return;
        setMyId(id || null); canWrite.current = w;
        if (w === false) setRo(true);
      }
      setDb(d || null);
    })().catch(() => alive && setDb(null));
    return () => { alive = false; };
  }, []);

  const onSubErr = useCallback(e => {
    if (e && e.code === "revoked") { setRo(true); return; }
    showToast("Lost the connection to your saved plan. Reload the page to reconnect.", "err");
  }, [showToast]);

  useEffect(() => {
    if (!db) return;
    const timer = setTimeout(() => setSlow(true), 10000);
    const u1 = db.doc("config/household").onSnapshot(s => {
      if (!s.metadata.fromCache) { clearTimeout(timer); setSlow(false); }
      if (s.exists || !s.metadata.fromCache) { setCfg(s.exists ? s.data() : null); setCfgReady(true); }
    }, e => { clearTimeout(timer); setCfgReady(true); onSubErr(e); });
    const u2 = db.collection("chores").onSnapshot(s => setChores(docsOf(s)), onSubErr);
    const u3 = db.collection("dishes").onSnapshot(s => setDishes(docsOf(s)), onSubErr);
    return () => { clearTimeout(timer); u1(); u2(); u3(); };
  }, [db, onSubErr]);

  const curWeekMonth = monthKey(mondayOf(parseYmd(today)));
  const curMonth = today.slice(0, 7);
  const taskMonths = [...new Set([curWeekMonth, month, shiftMonth(month, -1)])].sort().join(",");
  const mealMonths = [...new Set([curMonth, shiftMonth(curMonth, 1), month])].sort().join(",");
  useEffect(() => {
    if (!db) return;
    return db.collection("tasks").where("month", "in", taskMonths.split(",")).onSnapshot(s => setTasks(docsOf(s)), onSubErr);
  }, [db, taskMonths, onSubErr]);
  useEffect(() => {
    if (!db) return;
    return db.collection("meals").where("month", "in", mealMonths.split(",")).onSnapshot(s => {
      const m = {}; s.docs.forEach(d => { m[d.id] = { id: d.id, ...d.data() }; }); setMeals(m);
    }, onSubErr);
  }, [db, mealMonths, onSubErr]);

  const S = useRef({}); S.current = { cfg, chores, tasks, meals, dishes, today, myId };

  const guard = useCallback(async (fn, isCreate) => {
    try { await fn(); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === "invalid_argument" && isCreate && canWrite.current !== true) { setRo(true); showToast("This page is view-only for you. Ask the owner to invite you as an Editor.", "err"); }
      else if (code === "quota_exceeded") showToast("Storage is full. Remove some old ideas or chores and try again.", "err");
      else if (code === "revoked") setRo(true);
      else if (code === "resource_exhausted") showToast("That was a lot at once. Wait a moment and try again.", "err");
      else showToast("Couldn’t save that. Check your connection and try again.", "err");
      try { console.warn("Fair Share write failed", e); } catch (x) {}
      return false;
    }
  }, [showToast]);

  const batch = useCallback(async (label, ops, isCreate) => {
    if (!ops.length) return true;
    let n = 0; setBusy(`${label} 0 of ${ops.length}…`);
    const ok = await guard(() => runPool(ops, 4, op => withRetry(op), () => { n++; setBusy(`${label} ${n} of ${ops.length}…`); }), isCreate);
    setBusy(null); return ok;
  }, [guard]);

  const actions = useMemo(() => {
    const A = {};
    const cfgRef = () => db.doc("config/household");
    const freshMeals = async months => {
      try {
        const out = {};
        for (const mk of months) {
          const s = await withRetry(() => db.collection("meals").where("month", "==", mk).get());
          s.docs.forEach(d => { out[d.id] = { id: d.id, ...d.data() }; });
        }
        return out;
      } catch (e) { showToast("Couldn’t load the meal plan. Try again.", "err"); return null; }
    };
    const mealOp = (fresh, id, patch) => (fresh[id]
      ? () => db.doc("meals/" + id).update(patch)
      : () => db.doc("meals/" + id).set({ ...blankMeal(id), ...patch }));

    A.createConfig = (a, b) => {
      const body = JSON.parse(JSON.stringify(DEFAULT_CFG));
      body.people.a.name = norm(a); body.people.b.name = norm(b);
      body.people.a.uid = S.current.myId || null; body.createdAt = Date.now();
      return guard(() => withRetry(() => cfgRef().set(body)), true);
    };
    A.saveConfig = patch => guard(() => withRetry(() => cfgRef().update(patch)));
    A.linkMe = k => {
      const id = S.current.myId; if (!id) return;
      const pp = (S.current.cfg && S.current.cfg.people) || {};
      const patch = { people: { [k]: { uid: id } } };
      if (pp[other(k)] && pp[other(k)].uid === id) patch.people[other(k)] = { uid: null };
      return guard(() => withRetry(() => cfgRef().update(patch)));
    };
    A.addChores = async list => {
      const have = new Set(S.current.chores.map(c => keyOf(c.name)));
      let order = Math.max(0, ...S.current.chores.map(c => c.order || 0));
      const fresh = [];
      for (const c of list) { const k = keyOf(c.name); if (!k || have.has(k)) continue; have.add(k); fresh.push({ name: norm(c.name), freq: c.freq || "1w", effort: c.effort || 2, who: c.who || "rotate", order: ++order }); }
      if (!fresh.length) { showToast("Those chores are already on the list."); return; }
      if (await batch("Adding", fresh.map(c => () => db.collection("chores").doc("c" + rid()).set(c)), true)) {
        showToast(fresh.length === 1 ? `Added “${fresh[0].name}”. Use Fill gaps on the Chores tab to plan it.` : `Added ${fresh.length} chores. Use Fill gaps on the Chores tab to plan them.`);
      }
    };
    A.updateChore = (id, patch) => guard(() => withRetry(() => db.doc("chores/" + id).update(patch)));
    A.deleteChore = async id => {
      const wk = ymd(mondayOf(parseYmd(S.current.today)));
      const stale = S.current.tasks.filter(t => t.choreId === id && !t.done && t.week >= wk);
      if (await guard(() => withRetry(() => db.doc("chores/" + id).delete())) && stale.length) {
        await batch("Removing", stale.map(t => () => db.doc("tasks/" + t.id).delete()));
      }
    };
    A.toggleTask = t => {
      const pp = people(S.current.cfg); const me = S.current.myId;
      const mine = me && pp.a.uid === me ? "a" : me && pp.b.uid === me ? "b" : null;
      const patch = t.done ? { done: false, doneAt: null, doneBy: null } : { done: true, doneAt: Date.now(), doneBy: mine || t.who };
      return guard(() => withRetry(() => db.doc("tasks/" + t.id).update(patch)));
    };
    A.swapTask = t => guard(() => withRetry(() => db.doc("tasks/" + t.id).update({ who: other(t.who) })));
    A.planMonth = async (mk, mode) => {
      const { chores, tasks, cfg, today } = S.current;
      if (!chores.length) { showToast("Add some chores in Setup first."); return; }
      let monthTasks;
      try { monthTasks = docsOf(await withRetry(() => db.collection("tasks").where("month", "==", mk).get())); }
      catch (e) { showToast("Couldn’t load this month’s chores. Try again.", "err"); return; }
      const plan = planChores({ mk, chores, monthTasks, history: tasks, cfg, today, mode });
      if (!plan.weeks) { showToast(`${monthName(mk, false)} is already over.`); return; }
      const ops = [...plan.writes.map(w => () => db.doc("tasks/" + w.id).set(w.data)), ...plan.deletes.map(id => () => db.doc("tasks/" + id).delete())];
      if (!ops.length) { showToast(mode === "fill" ? "Everything is already planned." : "Already balanced. Nothing to change."); return; }
      if (await batch("Planning", ops, true)) {
        showToast(mode === "fill" ? `Planned ${plan.writes.length} chore${plan.writes.length === 1 ? "" : "s"} for ${monthName(mk, false)}.` : `Re-balanced ${monthName(mk, false)}: ${plan.writes.length} chore${plan.writes.length === 1 ? "" : "s"} changed.`);
      }
    };
    A.saveMeal = (id, patch) => {
      const cur = S.current.meals[id];
      return guard(() => withRetry(cur
        ? () => db.doc("meals/" + id).update(patch)
        : () => db.doc("meals/" + id).set({ ...blankMeal(id), ...patch })), !cur);
    };
    // Lunch and dinner of one day live in one document, so rows for the same day are merged into one write.
    A.applyMenu = async (rows, saveIdeas) => {
      const fresh = await freshMeals([...new Set(rows.map(r => r.id.slice(0, 7)))]);
      if (!fresh) return false;
      const patches = {};
      rows.forEach(r => { const F = MEALS[r.meal]; const p = (patches[r.id] = patches[r.id] || {}); p[F.dish] = r.dish; if (r.cook) p[F.cook] = r.cook; });
      const ok = await batch("Adding meals", Object.entries(patches).map(([id, p]) => mealOp(fresh, id, p)), true);
      if (ok) {
        if (saveIdeas) await A.addDishes(rows.map(r => ({ name: r.dish, meal: r.meal })), true);
        showToast(`Added ${rows.length} meal${rows.length === 1 ? "" : "s"} to the plan.`);
      }
      return ok;
    };
    A.fillCooks = async mk => {
      const fresh = await freshMeals([mk]); if (!fresh) return;
      const plan = planCooks({ mk, meals: fresh, cfg: S.current.cfg, today: S.current.today });
      if (!plan.count) { showToast("Every meal already has a cook."); return; }
      if (await batch("Assigning cooks", plan.rows.map(r => mealOp(fresh, r.id, r.patch)), true)) showToast(`Picked a cook for ${plan.count} meal${plan.count === 1 ? "" : "s"}.`);
    };
    A.fillDishes = async mk => {
      const { dishes, today, cfg } = S.current;
      if (!dishes.length) { showToast("Add a few meal ideas first."); return; }
      const fresh = await freshMeals([mk]); if (!fresh) return;
      const work = {}; Object.keys(fresh).forEach(k => { work[k] = { ...fresh[k] }; });
      const patches = {}; let n = 0;
      for (const d of daysOfMonth(mk)) {
        const id = ymd(d); if (id < today) continue;
        for (const s of mealSlots(cfg)) {
          const f = MEALS[s].dish; if (work[id] && work[id][f]) continue;
          const dish = suggestDish(dishes, work, id, s); if (!dish) continue;
          work[id] = { ...(work[id] || {}), [f]: dish }; (patches[id] = patches[id] || {})[f] = dish; n++;
        }
      }
      if (!n) { showToast("Nothing left to fill. Empty meals need ideas tagged for them."); return; }
      if (await batch("Filling meals", Object.entries(patches).map(([id, p]) => mealOp(fresh, id, p)), true)) showToast(`Filled ${n} empty meal${n === 1 ? "" : "s"} with ideas.`);
    };
    A.addDishes = async (items, quiet) => {
      const have = new Set(S.current.dishes.map(d => keyOf(d.name)));
      const fresh = new Map();
      for (const it of items) {
        const name = norm(typeof it === "string" ? it : it.name);
        const meal = typeof it === "string" ? null : it.meal || null;
        const k = keyOf(name); if (!k || have.has(k)) continue;
        if (fresh.has(k)) { if (fresh.get(k).meal !== meal) fresh.get(k).meal = null; } else fresh.set(k, { name, meal });
      }
      const list = [...fresh.values()];
      if (!list.length) { if (!quiet) showToast("That’s already in your ideas."); return true; }
      const ok = await batch("Saving ideas", list.map(x => () => db.collection("dishes").doc("d" + rid()).set({ name: x.name, meal: x.meal, createdAt: Date.now() })), true);
      if (ok && !quiet) showToast(list.length === 1 ? `Saved “${list[0].name}”.` : `Saved ${list.length} ideas.`);
      return ok;
    };
    A.setIdeaMeal = (id, meal) => guard(() => withRetry(() => db.doc("dishes/" + id).update({ meal })));
    A.deleteDish = id => guard(() => withRetry(() => db.doc("dishes/" + id).delete()));
    return A;
  }, [db, guard, batch, showToast]);

  const pp = people(cfg);
  const me = myId && pp.a.uid === myId ? "a" : myId && pp.b.uid === myId ? "b" : null;
  const choreMap = useMemo(() => Object.fromEntries(chores.map(c => [c.id, c])), [chores]);
  const ctx = { db, cfg: cfg || DEFAULT_CFG, pp, me, myId, chores, choreMap, dishes, tasks, meals, today, ro, actions, busy, month, setMonth, setTab, showToast };

  let body;
  if (db === undefined || (db && !cfgReady && !slow)) body = html`<${Loading} note="Loading your chores and meal plan…"/>`;
  else if (db === null) body = html`<section className="card welcome"><h1>Open this on claude.ai</h1><p>Fair Share keeps your chores and dinners in this page’s shared storage, so it needs to be opened on claude.ai while you’re signed in.</p></section>`;
  else if (!cfgReady) body = html`<${Loading} note="Can’t reach your saved plan right now. This page keeps trying."/>`;
  else if (!cfg) body = html`<${Welcome} ctx=${ctx}/>`;
  else if (tab === "chores") body = html`<${ChoresTab} ctx=${ctx}/>`;
  else if (tab === "meals") body = html`<${MealsTab} ctx=${ctx}/>`;
  else if (tab === "setup") body = html`<${SetupTab} ctx=${ctx}/>`;
  else body = html`<${Home} ctx=${ctx}/>`;

  return html`<div className="app">
    <header className="topbar">
      <div className="brand"><${Logo} pp=${pp}/><span>Fair Share</span></div>
      ${cfg && html`<nav className="tabs" role="tablist" aria-label="Sections">${TABS.map(([id, label]) => html`<button key=${id} role="tab" aria-selected=${tab === id} className=${"tab" + (tab === id ? " on" : "")} onClick=${() => setTab(id)}>${label}</button>`)}</nav>`}
    </header>
    ${ro && cfg && html`<div className="banner">You can look, but not change things here. Ask the owner to invite you from the Share menu as an <b>Editor</b>.</div>`}
    ${slow && cfgReady && html`<div className="banner">Can’t reach your saved plan right now, so this may be out of date.</div>`}
    <main>${body}</main>
    ${(busy || toast) && html`<div className=${"toast" + (!busy && toast && toast.kind === "err" ? " err" : "")} role="status" aria-live="polite">${busy || toast.text}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
